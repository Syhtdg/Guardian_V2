<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6b7480"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="20" fill="#0f1115"/>

  <!-- 노드 공통: 190x150 -->
  <!-- 1. 카메라 -->
  <g transform="translate(30 76)">
    <rect width="190" height="160" rx="16" fill="#181b21" stroke="#2a2f38"/>
    <circle cx="95" cy="44" r="26" fill="#1c3550"/>
    <rect x="80" y="34" width="24" height="18" rx="4" fill="none" stroke="#4ea8ff" stroke-width="2.5"/>
    <path d="M104 39l8-4v16l-8-4" fill="none" stroke="#4ea8ff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="95" y="96" fill="#e8ebef" font-size="17" font-weight="700" text-anchor="middle">카메라 · 영상</text>
    <text x="95" y="120" fill="#9aa4b2" font-size="12.5" text-anchor="middle">웹캠 · RTSP · 영상 파일</text>
    <text x="95" y="140" fill="#6b7480" font-size="11.5" text-anchor="middle">OpenCV 로 프레임 읽기</text>
  </g>

  <!-- 2. AI 감지기 -->
  <g transform="translate(270 76)">
    <rect width="190" height="160" rx="16" fill="#181b21" stroke="#5a3a26"/>
    <circle cx="95" cy="44" r="26" fill="#4a2414"/>
    <path d="M95 26c3 8-3 11-3 16 0 3 2 5 5 5 3 0 6-3 5-8 6 4 10 10 10 17a17 17 0 0 1-34 0c0-15 13-20 17-30z" fill="#ff7a3d"/>
    <text x="95" y="96" fill="#e8ebef" font-size="17" font-weight="700" text-anchor="middle">AI 감지기</text>
    <text x="95" y="120" fill="#9aa4b2" font-size="12.5" text-anchor="middle">detect.py · YOLO11s</text>
    <text x="95" y="140" fill="#6b7480" font-size="11.5" text-anchor="middle">10프레임 중 4회 → 확정</text>
  </g>

  <!-- 3. API 서버 -->
  <g transform="translate(510 76)">
    <rect width="190" height="160" rx="16" fill="#181b21" stroke="#24452f"/>
    <circle cx="95" cy="44" r="26" fill="#173323"/>
    <ellipse cx="95" cy="34" rx="13" ry="5" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
    <path d="M82 34v20c0 3 6 5 13 5s13-2 13-5V34M82 44c0 3 6 5 13 5s13-2 13-5" fill="none" stroke="#2ecc71" stroke-width="2.5"/>
    <text x="95" y="96" fill="#e8ebef" font-size="17" font-weight="700" text-anchor="middle">API 서버</text>
    <text x="95" y="120" fill="#9aa4b2" font-size="12.5" text-anchor="middle">Express · MongoDB</text>
    <text x="95" y="140" fill="#6b7480" font-size="11.5" text-anchor="middle">저장 · 스냅샷 · 인증</text>
  </g>

  <!-- 4. 대시보드 -->
  <g transform="translate(750 76)">
    <rect width="180" height="160" rx="16" fill="#181b21" stroke="#5a2626"/>
    <circle cx="90" cy="44" r="26" fill="#4a1717"/>
    <rect x="75" y="32" width="30" height="20" rx="3" fill="none" stroke="#ff6b66" stroke-width="2.5"/>
    <path d="M84 58h12M90 52v6" stroke="#ff6b66" stroke-width="2.5" stroke-linecap="round"/>
    <text x="90" y="96" fill="#e8ebef" font-size="17" font-weight="700" text-anchor="middle">관제 대시보드</text>
    <text x="90" y="120" fill="#9aa4b2" font-size="12.5" text-anchor="middle">Vue 3 · Vuetify</text>
    <text x="90" y="140" fill="#6b7480" font-size="11.5" text-anchor="middle">경보 · 지도 · 기록</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#6b7480" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M222 156h44"/>
    <path d="M462 156h44"/>
    <path d="M702 156h44"/>
  </g>
  <g font-size="12" fill="#c3cad4" text-anchor="middle">
    <text x="245" y="60">프레임</text>
    <text x="485" y="52">POST /ai/result</text>
    <text x="485" y="68" fill="#6b7480" font-size="11">X-API-Key</text>
    <text x="725" y="52">socket.io</text>
    <text x="725" y="68" fill="#6b7480" font-size="11">로그인(JWT) 필요</text>
  </g>
  <g stroke="#3a3f48" stroke-dasharray="3 4">
    <path d="M245 66v74M485 74v66M725 74v66"/>
  </g>

  <text x="30" y="40" fill="#e8ebef" font-size="16" font-weight="700">Guardian 시스템 구성</text>
  <text x="30" y="272" fill="#6b7480" font-size="12">감지기는 API 키로만 결과를 올릴 수 있고, 대시보드는 로그인한 사용자에게만 실시간 경보를 보냅니다.</text>
</svg>
