<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', Roboto, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2635"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a2a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3d1f"/>
      <stop offset=".6" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="flameIn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
    <radialGradient id="smoke" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9aa4b2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9aa4b2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="feed"><rect x="36" y="64" width="448" height="240" rx="10"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- 모니터 -->
  <rect x="20" y="20" width="480" height="300" rx="18" fill="#12151b" stroke="#2a2f38" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="44" cy="42" r="5" fill="#ff4d4f"/>
  <text x="56" y="47" fill="#ff8a8a" font-size="13" font-weight="700">LIVE</text>
  <text x="98" y="47" fill="#c3cad4" font-size="13">CAM-02 · 중앙도서관 후문</text>

  <!-- 카메라 화면 -->
  <g clip-path="url(#feed)">
    <rect x="36" y="64" width="448" height="240" fill="url(#sky)"/>
    <g fill="#0c1110">
      <rect x="58" y="150" width="10" height="120"/><circle cx="63" cy="146" r="28"/>
      <rect x="110" y="128" width="12" height="140"/><circle cx="116" cy="124" r="34"/>
      <rect x="168" y="160" width="9" height="110"/><circle cx="172" cy="154" r="24"/>
      <rect x="350" y="138" width="12" height="130"/><circle cx="356" cy="132" r="32"/>
      <rect x="410" y="156" width="10" height="112"/><circle cx="415" cy="150" r="26"/>
      <rect x="452" y="132" width="12" height="136"/><circle cx="458" cy="126" r="30"/>
    </g>
    <rect x="36" y="262" width="448" height="42" fill="#0f1412"/>
    <!-- 연기 -->
    <circle cx="272" cy="150" r="46" fill="url(#smoke)"/>
    <circle cx="300" cy="118" r="56" fill="url(#smoke)"/>
    <circle cx="330" cy="90" r="48" fill="url(#smoke)"/>
    <!-- 불 -->
    <ellipse cx="270" cy="246" rx="90" ry="70" fill="url(#glow)"/>
    <path d="M270 168c10 26-12 36-12 54 0 10 7 17 15 17 11 0 18-10 16-25 19 13 32 34 32 56a51 51 0 0 1-102 0c0-48 40-62 51-102z" fill="url(#flameOut)"/>
    <path d="M271 222c4 11-5 16-5 24 0 5 4 8 8 8 5 0 9-5 8-12 9 6 14 15 14 25a25 25 0 0 1-50 0c0-21 18-27 25-45z" fill="url(#flameIn)"/>
    <!-- 감지 박스 -->
    <rect x="212" y="158" width="118" height="128" fill="none" stroke="#ff3b30" stroke-width="3" rx="2"/>
    <rect x="212" y="138" width="78" height="20" fill="#ff3b30"/>
    <text x="218" y="153" fill="#fff" font-size="12.5" font-weight="700">fire 91%</text>
    <rect x="248" y="72" width="150" height="104" fill="none" stroke="#c3cad4" stroke-width="2" stroke-dasharray="6 4" rx="2"/>
    <rect x="248" y="72" width="86" height="18" fill="#9aa4b2"/>
    <text x="253" y="85" fill="#111" font-size="11.5" font-weight="700">smoke 68%</text>
  </g>

  <!-- 하단 막대 -->

  <!-- 실시간 연결 칩 -->
  <g filter="url(#shadow)">
    <rect x="392" y="6" width="150" height="34" rx="17" fill="#13281d" stroke="#2ecc71" stroke-opacity=".5"/>
    <circle cx="412" cy="23" r="5" fill="#2ecc71"/>
    <text x="424" y="28" fill="#7be2a7" font-size="13" font-weight="600">실시간 연결됨</text>
  </g>

  <!-- 경보 카드 -->
  <g filter="url(#shadow)">
    <rect x="318" y="262" width="270" height="140" rx="16" fill="#1d2129" stroke="#3a2a2a"/>
    <rect x="318" y="262" width="270" height="44" rx="16" fill="#c62828"/>
    <rect x="318" y="290" width="270" height="16" fill="#c62828"/>
    <path d="M343 272c3 7-3 9-3 14 0 3 2 5 4 5 3 0 5-3 4-7 5 4 9 9 9 15a14 14 0 0 1-28 0c0-13 11-17 14-27z" fill="#fff"/>
    <text x="368" y="291" fill="#fff" font-size="17" font-weight="700">화재 감지</text>
    <text x="538" y="290" fill="#ffd0d0" font-size="12" text-anchor="end">방금 전</text>
    <text x="338" y="332" fill="#9aa4b2" font-size="12">위치</text>
    <text x="378" y="332" fill="#e8ebef" font-size="13">중앙도서관 후문</text>
    <text x="338" y="356" fill="#9aa4b2" font-size="12">신뢰도</text>
    <rect x="384" y="347" width="150" height="7" rx="3.5" fill="#2a2f38"/>
    <rect x="384" y="347" width="137" height="7" rx="3.5" fill="#ff5a36"/>
    <text x="568" y="356" fill="#e8ebef" font-size="12" text-anchor="end">91%</text>
    <rect x="338" y="370" width="230" height="22" rx="8" fill="#e53935"/>
    <text x="453" y="385" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">확인 (경보 끄기)</text>
  </g>

  <!-- 지도 핀 카드 -->
  <g filter="url(#shadow)">
    <rect x="0" y="300" width="150" height="108" rx="14" fill="#1d2129" stroke="#2a2f38"/>
    <path d="M14 330h122M14 352h122M14 374h122M40 312v84M76 312v84M112 312v84" stroke="#2a2f38" stroke-width="1.5"/>
    <path d="M60 326c-9 0-15 7-15 15 0 11 15 25 15 25s15-14 15-25c0-8-6-15-15-15z" fill="#ff5a36" stroke="#fff" stroke-width="2"/>
    <path d="M104 344c-7 0-11 5-11 11 0 8 11 18 11 18s11-10 11-18c0-6-4-11-11-11z" fill="#6b7480" stroke="#fff" stroke-width="2"/>
    <text x="14" y="398" fill="#9aa4b2" font-size="11">감지 위치</text>
  </g>
</svg>
