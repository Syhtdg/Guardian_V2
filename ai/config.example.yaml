# detect.py 설정. config.yaml 로 복사해서 쓰세요.  (copy config.example.yaml config.yaml)

server:
  url: http://localhost:10111
  api_key: ""          # backend-main/.env 의 AI_API_KEY 와 똑같이
  timeout_sec: 5

camera:
  id: cam-01
  # 0 = PC 웹캠, "rtsp://아이디:비번@192.168.0.10:554/stream1" = IP 카메라, "test.mp4" = 영상 파일
  source: 0
  location: 대구가톨릭대학교 정문 앞
  latitude: 35.9135    # 대시보드 지도에 마커로 표시 (모르면 지우세요)
  longitude: 128.8125

model:
  weights: weights/guardian_best.pt
  imgsz: 640
  device: "0"          # GPU 번호, CPU 는 "cpu"
  # 모델 클래스 이름 → 대시보드에 보낼 이름
  class_names:
    fire: 불
    smoke: 연기

detection:
  # 클래스별 최소 신뢰도 (0~1). 오탐이 많으면 올리고, 놓치면 내리세요.
  conf:
    fire: 0.50
    smoke: 0.45
  # 최근 window 프레임 중 hits 번 이상 잡혀야 진짜로 보고 알림 (깜빡이는 오탐 방지)
  confirm_window: 10
  confirm_hits: 4
  # 같은 종류 알림을 다시 보내기까지 기다리는 시간(초)
  cooldown_sec: 60
  # N 프레임마다 한 번 추론 (CPU 라면 3~5 로 올리세요)
  frame_stride: 1
  # 너무 작은 박스는 무시 (프레임 면적 대비 비율)
  min_box_area_ratio: 0.0005

snapshot:
  enabled: true
  draw_boxes: true
  max_width: 1280
  jpeg_quality: 80

display:
  show_window: true    # 감지 화면 창 띄우기 (q 로 종료)
