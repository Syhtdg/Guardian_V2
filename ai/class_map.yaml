# 원본 데이터셋의 클래스 → Guardian 클래스(fire / smoke) 연결표
#
# ⚠️ 반드시 확인하세요
#   AI Hub 「화재 발생 예측 영상」 라벨은 클래스를 "01"~"10" 같은 코드로 적습니다.
#   코드가 무엇을 뜻하는지는 데이터와 함께 받는 "데이터 구축 가이드/활용 가이드" PDF 에 있습니다.
#   먼저 아래 명령으로 실제 라벨에 어떤 코드가 몇 개 있는지 확인한 뒤 이 표를 고치세요.
#
#     python convert_aihub.py --labels <라벨 폴더> --inspect
#
# 값 의미
#   fire   → 학습 클래스 0 (대시보드에 "불")
#   smoke  → 학습 클래스 1 (대시보드에 "연기")
#   ignore → 학습에서 빼되, 그 이미지는 "불/연기 아님" 예시(배경)로 씁니다.
#            구름·안개·조명·햇빛처럼 헷갈리는 장면을 ignore 로 두면 오탐이 줄어듭니다.
#
# 아래 표는 「화재 발생 예측 영상」 실제 라벨로 확인한 값입니다.
#   - 화재씬(파일명 ..MF..)에는 01~04 만, 유사씬(..MS..)에는 05~10 만 나옵니다.
#   - 예: S3-N0844MF02728.jpg 에서 03 박스는 위쪽 회색 연기, 04 박스는 아래 불꽃입니다.
#   - 01·02 는 화재씬의 연기 기둥(위쪽 큰 박스)로 보여 smoke 로 둡니다.
#     세부 뜻(흑색/백색 연기 등)은 가이드 PDF 로 한 번 더 확인하세요.
mapping:
  "01": smoke    # 화재씬 연기
  "02": smoke    # 화재씬 연기
  "03": smoke    # 화재씬 연기 (회색 연기 확인)
  "04": fire     # 화염(불꽃) — 화재씬에서 가장 많음
  "05": ignore   # 유사씬 (불·연기와 헷갈리는 장면)
  "06": ignore
  "07": ignore
  "08": ignore
  "09": ignore
  "10": ignore

  # 이름으로 된 라벨(다른 공공데이터나 COCO 형식)도 같이 처리됩니다
  fire: fire
  flame: fire
  화염: fire
  불꽃: fire
  smoke: smoke
  연기: smoke
  흑색연기: smoke
  백색연기: smoke
